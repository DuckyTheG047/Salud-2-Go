<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="robots" content="noindex,nofollow">
  <title>Salud 2 Go</title>
  <script>
  (function(){
    var key="salud2go_experiment_variant";
    var routes={control:"/C/",ganga:"/G/",alto:"/E/"};
    var variant=null;
    try{ variant=localStorage.getItem(key); }catch(e){}
    if(!routes[variant]){
      var r=Math.random();
      variant=r<1/3?"control":(r<2/3?"ganga":"alto");
      try{ localStorage.setItem(key,variant); }catch(e){}
    }
    location.replace(routes[variant]);
  })();
  </script>
</head>
<body></body>
</html>
