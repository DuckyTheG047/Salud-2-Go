  (function(){
    var key="salud2go_experiment_variant";
    var routes={control:"/C/",ganga:"/G/",alto:"/E/"};
    var variant=null;
    try{ variant=localStorage.getItem(key); }catch(e){}
    if(!routes[variant]){
      var r=Math.random();
      variant=r<1/3?"control":(r<2/3?"ganga":"alto");

    }

function touch(e){if(!e.touches?.length)return;const rect=slider.getBoundingClientRect();if(!rect.width)return;slider.value=String(Math.max(1,Math.min(6,Math.round(1+5*(e.touches[0].clientX-rect.left)/rect.width))));apply();}
slider.addEventListener('input',apply);slider.addEventListener('change',apply);slider.addEventListener('touchstart',touch,{passive:true});slider.addEventListener('touchmove',touch,{passive:true});slider.addEventListener('touchend',function(){apply();slider.dispatchEvent(new Event('change',{bubbles:true}))},{passive:true});
